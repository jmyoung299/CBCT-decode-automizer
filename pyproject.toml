[project]
name = "dicom-decoder"
version = "0.1.1"
description = "DICOM parser core with wrapper-sniffer pipeline."
requires-python = ">=3.10"
dependencies = [
  "pydicom",
  "boto3",
  "fastapi",
  "uvicorn",
  "python-multipart",
]

[project.scripts]
dicom-parse = "dicom_decoder.cli:main"
dicom-parse-batch = "dicom_decoder.cli_batch:main"
dicom-golden = "dicom_decoder.cli_golden:main"
dicom-web-demo = "dicom_decoder.web_demo:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
