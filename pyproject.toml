[project]
name = "dicom-decoder"
version = "0.1.0"
description = "DICOM parser core with wrapper-sniffer pipeline."
requires-python = ">=3.10"
dependencies = [
  "pydicom",
]

[project.scripts]
dicom-parse = "dicom_decoder.cli:main"
dicom-parse-batch = "dicom_decoder.cli_batch:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "boto3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
